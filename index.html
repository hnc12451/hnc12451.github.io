<!DOCTYPE html>
<html>
    <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- we import arjs version without NFT but with marker + location based support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        </head>
    <body style="margin : 0px; overflow: hidden;">
     <a-scene embedded vr-mode-ui="enabled: false;" arjs="debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 4x4_bch_13_5_5;">
        <a-marker preset="barcode" value="0">
            <!-- we use cors proxy to avoid cross-origin problems ATTENTION! you need to set up your server -->
            <a-entity
            position="0 0 0"
            scale="1 1 1"
            gltf-model="oysters.glb"
            ></a-entity>
        </a-marker>
         <a-marker preset="barcode" value="10">
            <!-- we use cors proxy to avoid cross-origin problems ATTENTION! you need to set up your server -->
            <a-entity
            position="0 0 0"
            scale="0.05 0.05 0.05"
            gltf-model="Zhajiangmian.glb"
            ></a-entity>
        </a-marker>




       
        <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
