<!DOCTYPE html>
<html>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- we import arjs version without NFT but with marker + location based support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <body style="margin : 0px; overflow: hidden;">
        <a-scene embedded arjs>
          
    <a-assets>
       <a-asset-item id="oni" src="oysters.glb"></a-asset-item>
        <a-asset-item id="bowl" src="Zhajiangmian.glb"></a-asset-item>


    </a-assets>

      <a-marker type='barcode' value='6'>
        <a-entity
          gltf-model="oysters.glb"
          scale=".5 .5 .5"
          position="0 0 0"
        ></a-entity>
    </a-marker>
      
      <a-marker type="barcode" value="0">
        <a-box 
          scale=".5 .5 .5"
            position="0 0.5 0" 
               material="src: #grid; color: yellow; transparent: true; opacity: 0.50;">
        </a-box>
    </a-marker>


       <a-marker type='barcode' value='20'>
        <a-entity
          gltf-model="Zhajiangmian.glb"
          scale=".5 .5 .5"
          position="0 0 0"
        ></a-entity>
         </a-marker>


      


      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
