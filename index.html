<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    
    <!-- Include A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Include AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <!-- Prevent scrolling and scrolling on mobile devices -->
  <body style="margin: 0; overflow: hidden;">
    
    <!-- 
      Set up the A-Frame scene.
      - embedded: Tells A-Frame to run inside the web page, not fullscreen VR.
      - arjs: Configures AR.js to look for barcode markers using your requested dictionary.
    -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 4x4_bch_13_5_5;"
      renderer="logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false">
      
      <!-- 
        ASSET MANAGER
        Pre-load your 3D models here when you have them. 
        I've left two blank asset slots for you to fill in later.
      -->
      <a-assets>
        <a-asset-item id="model-01" src="oysters.glb"></a-asset-item>
        <a-asset-item id="model-02" src="assets/models/your_model_2.glb"></a-asset-item>
      </a-assets>

      <!-- 
        MARKER 1: Barcode Value "0"
        When the camera sees barcode marker #0, it will display what is inside this tag.
      -->
      <a-marker type="barcode" value="0">
        <!-- Placeholder Box (Replace with the line below when your model is ready) -->
       <!--> <a-box position="0 0.5 0" material="color: red; opacity: 0.8;"></a-box> -->
        
        <!-- How to use your 3D model instead: -->
       <a-entity gltf-model="#model-01" position="0 0 0" scale="1 1 1" rotation="0 0 0"></a-entity> 
      </a-marker>

      <!-- 
        MARKER 2: Barcode Value "1"
      -->
      <a-marker type="barcode" value="1">
        <!-- Placeholder Sphere (Replace with the line below when your model is ready) -->
        <a-sphere position="0 0.5 0" radius="0.5" material="color: blue; opacity: 0.8;"></a-sphere>
        
        <!-- How to use your 3D model instead: -->
        <!-- <a-entity gltf-model="#model-02" position="0 0 0" scale="1 1 1" rotation="0 0 0"></a-entity> -->
      </a-marker>

      <!-- The AR Camera -->
      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
